# Keeps the digest-pinned Node base image in host/Dockerfile current (tag and digest together).
version: 2
updates:
  - package-ecosystem: docker
    directory: /host
    schedule:
      interval: weekly
    ignore:
      # Stay on the current LTS line; a major Node move is a deliberate change, not a weekly bump.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
