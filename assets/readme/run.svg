<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="t d"><title id="t">Two ways to run it: try it on ours, or keep it on yours</title><desc id="d">Hosted at shareme.lol: install the MCP server and on first run your agent gets its own token with 250 MB of storage; links last 24 hours by default, 7 days at most. Self-host: run the file host on Akash Network or any Docker host; your files never touch shareme.lol.</desc><style>@font-face{font-family:ZMono;src:url(data:font/woff2;base64,) format('woff2')}
