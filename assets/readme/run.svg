</style><defs><clipPath id="frame"><rect width="1280" height="330" rx="20"/></clipPath><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><g clip-path="url(#frame)"><rect width="1280" height="330" fill="#000"/><rect x="48.0" y="46.0" width="170.2" height="32" rx="16.0" fill="#080707" stroke="rgba(242,228,216,0.07)"/><text x="133.1" y="66.6" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#9b8f79" text-anchor="middle">Two ways to run it</text><text x="48.0" y="126.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="35" fill="#9b8f79" text-anchor="start" letter-spacing="-0.5">Try it on ours.</text><text x="270.5" y="126.0" font-family="ZSerif,'Instrument Serif',Georgia,serif" font-size="40" fill="#efe6df" text-anchor="start">Or keep it on yours.</text><rect x="48" y="160" width="582" height="138" rx="15" fill="#0a0909" stroke="rgba(239,230,223,0.1)"/><text x="72.0" y="192.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#ec9117" text-anchor="start" letter-spacing="0.6">HOSTED</text><text x="606.0" y="192.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="18" fill="#efe6df" text-anchor="end" letter-spacing="-0.3">shareme.lol</text><text x="72.0" y="222.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="15" fill="#928b86" text-anchor="start">Your agent gets its own token on first run:</text><text x="72.0" y="243.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="15" fill="#928b86" text-anchor="start">250 MB, links 24 h by default, 7 days at most.</text><rect x="64" y="258" width="550" height="28" rx="8" fill="rgba(255,255,255,0.03)"/><text x="76.0" y="276.5" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#efe6df" text-anchor="start" letter-spacing="-0.3">&gt; npx -y share-me-mcp@0.1.0 signup</text><rect x="650" y="160" width="582" height="138" rx="15" fill="#0a0909" stroke="rgba(239,230,223,0.1)"/><text x="674.0" y="192.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#ec9117" text-anchor="start" letter-spacing="0.6">SELF-HOST</text><text x="1208.0" y="192.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="18" fill="#efe6df" text-anchor="end" letter-spacing="-0.3">Your server</text><text x="674.0" y="222.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="15" fill="#928b86" text-anchor="start">Run the host on Akash or any Docker host.</text><text x="674.0" y="243.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="15" fill="#928b86" text-anchor="start">Your files never touch shareme.lol.</text><rect x="666" y="258" width="550" height="28" rx="8" fill="rgba(255,255,255,0.03)"/><text x="678.0" y="276.5" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#efe6df" text-anchor="start" letter-spacing="-0.3">&gt; npx -y share-me-mcp@0.1.0 signup https://your-host</text><rect width="1280" height="330" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:soft-light"/></g><rect x=".5" y=".5" width="1279" height="329" rx="20" fill="none" stroke="rgba(239,230,223,0.1)"/></svg>