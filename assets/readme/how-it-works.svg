<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d"><title id="t">How share-me works</title><desc id="d">An attachment sits in every inbox it reaches. A link expires, and you can revoke it. The agent calls share_file on your machine; the MCP server checks the folder allowlist and scans for secrets, then uploads. The host checks the file type, serves it at an unguessable link and deletes it at expiry. Tools: share_file (file in, link out), list_links (see what&#x27;s live and for how long), revoke_link (end a link now, the file is deleted).</desc><style>@font-face{font-family:ZMono;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZSans;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZMono5;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:ZSans5;src:url(data:font/woff2;base64,) format('woff2')}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#918a85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><clipPath id="frame"><rect width="1280" height="640" rx="20"/></clipPath><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><g clip-path="url(#frame)"><rect width="1280" height="640" fill="#000"/><rect x="48.0" y="46.0" width="124.2" height="32" rx="16.0" fill="#080707" stroke="rgba(242,228,216,0.07)"/><text x="110.1" y="66.6" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#9b8f79" text-anchor="middle">How it works</text><text x="48.0" y="130.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="38" fill="#9b8f79" text-anchor="start" letter-spacing="-1">An attachment sits in every inbox it reaches.</text><text x="48.0" y="178.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="38" fill="#efe6df" text-anchor="start" letter-spacing="-1">A link expires, and you can revoke it.</text><rect x="48" y="230" width="269" height="170" rx="15" fill="#0a0909" stroke="rgba(239,230,223,0.1)"/><text x="70.0" y="266.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#ec9117" text-anchor="start" letter-spacing="0.6">YOUR AGENT</text><text x="70.0" y="302.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="15" fill="#efe6df" text-anchor="start" letter-spacing="-0.3">share_file(path)</text><text x="70.0" y="338.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">Asks for a link to a</text><text x="70.0" y="360.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">file it just made.</text><path d="M323 315.0 H347" fill="none" stroke="#918a85" stroke-width="1.4" marker-end="url(#ah)"/><rect x="353" y="230" width="269" height="170" rx="15" fill="#0a0909" stroke="rgba(239,230,223,0.1)"/><text x="375.0" y="266.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#ec9117" text-anchor="start" letter-spacing="0.6">YOUR MACHINE</text><text x="375.0" y="302.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="22" fill="#efe6df" text-anchor="start" letter-spacing="-0.3">share-me-mcp</text><text x="375.0" y="338.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">Allowlisted folders only.</text><text x="375.0" y="360.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">Secret scan before upload.</text><path d="M628 315.0 H652" fill="none" stroke="#918a85" stroke-width="1.4" marker-end="url(#ah)"/><rect x="658" y="230" width="269" height="170" rx="15" fill="#0a0909" stroke="rgba(239,230,223,0.1)"/><text x="680.0" y="266.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#ec9117" text-anchor="start" letter-spacing="0.6">THE HOST</text><text x="680.0" y="302.0" font-family="ZSans5,'DM Sans',system-ui,sans-serif" font-size="22" fill="#efe6df" text-anchor="start" letter-spacing="-0.3">shareme.lol</text><text x="680.0" y="338.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">File type checked.</text><text x="680.0" y="360.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">Deleted at expiry.</text><path d="M933 315.0 H957" fill="none" stroke="#918a85" stroke-width="1.4" marker-end="url(#ah)"/><rect x="963" y="230" width="269" height="170" rx="15" fill="#0a0909" stroke="rgba(239,230,223,0.1)"/><text x="985.0" y="266.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#ec9117" text-anchor="start" letter-spacing="0.6">YOUR HUMAN</text><text x="985.0" y="302.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="15" fill="#efe6df" text-anchor="start" letter-spacing="-0.3">shareme.lol/r/Xk3p9Qa2Lm</text><text x="985.0" y="338.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">Opens the link. No account,</text><text x="985.0" y="360.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">no attachment size limit.</text><text x="48.0" y="440.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="11.2" fill="#9b8f79" text-anchor="start" letter-spacing="0.6">THREE TOOLS</text><rect x="48" y="458" width="376" height="96" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(239,230,223,0.1)"/><text x="68.0" y="496.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="16" fill="#efe6df" text-anchor="start">share_file</text><text x="68.0" y="528.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">File in, link out.</text><rect x="452" y="458" width="376" height="96" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(239,230,223,0.1)"/><text x="472.0" y="496.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="16" fill="#efe6df" text-anchor="start">list_links</text><text x="472.0" y="528.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">See what’s live and for how long.</text><rect x="856" y="458" width="376" height="96" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(239,230,223,0.1)"/><text x="876.0" y="496.0" font-family="ZMono5,'JetBrains Mono',ui-monospace,monospace" font-size="16" fill="#efe6df" text-anchor="start">revoke_link</text><text x="876.0" y="528.0" font-family="ZSans,'DM Sans',system-ui,sans-serif" font-size="16" fill="#928b86" text-anchor="start">End a link now. The file is deleted.</text><text x="640.0" y="604.0" font-family="ZMono,'JetBrains Mono',ui-monospace,monospace" font-size="12.8" fill="#918a85" text-anchor="middle">Expiry deletes the file from the server, not copies people already saved.</text><rect width="1280" height="640" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:soft-light"/></g><rect x=".5" y=".5" width="1279" height="639" rx="20" fill="none" stroke="rgba(239,230,223,0.1)"/></svg>